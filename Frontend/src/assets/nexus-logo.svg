<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="#1a1a1a"/>

  <!-- Pink diagonal: top-left → bottom-right -->
  <line x1="28" y1="28" x2="92" y2="92" stroke="#f43f5e" stroke-width="9" stroke-linecap="round"/>
  <!-- Blue diagonal: top-right → bottom-left -->
  <line x1="92" y1="28" x2="28" y2="92" stroke="#3b82f6" stroke-width="9" stroke-linecap="round"/>

  <!-- Endpoint circles -->
  <circle cx="28" cy="28" r="9" fill="#f43f5e"/>
  <circle cx="92" cy="92" r="9" fill="#f43f5e"/>
  <circle cx="92" cy="28" r="9" fill="#3b82f6"/>
  <circle cx="28" cy="92" r="9" fill="#3b82f6"/>

  <!-- Center orange circle -->
  <circle cx="60" cy="60" r="13" fill="#f59e0b"/>
</svg>
