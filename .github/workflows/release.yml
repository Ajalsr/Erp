name: Release desktop app

# Push a tag like v1.0.1 to trigger, or run manually from the Actions tab.
# Builds BOTH Windows (.msi/.exe) and macOS (.dmg, universal Intel+Apple
# Silicon) in parallel on their native runners, attaches all installers to one
# GitHub Release, then a single publish-site job copies them into Spifora-site
# with fixed filenames and syncs the version badge.
#
# Download links on spifora.html stay fixed (/downloads/Spifora_1.0.0_x64-setup.exe
# etc) regardless of the real build version — if you bump to a new filename
# scheme, update those hrefs by hand. The "Version X.X.X — released YYYY-MM-DD"
# badge IS kept in sync automatically, read from src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  # ── 1. Build installers on each OS, attach to one GitHub Release ──────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    # GITHUB_TOKEN defaults to read-only on repos/orgs with restrictive default
    # token permissions — without this, tauri-action's "create a release" API
    # call 403s with "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Checkout Erp
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal binary needs both arch targets present.
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root deps (tauri CLI)
        run: npm install

      - name: Install Frontend deps
        run: npm ci
        working-directory: Frontend

      # Builds Frontend (via tauri.conf.json's beforeBuildCommand, using
      # Frontend/.env.production — must already point at the real hosted
      # api.spifora.com), compiles the Rust shell, bundles the platform
      # installers, and creates/updates a single GitHub Release with them
      # attached (the first matrix leg creates it, the second reuses it).
      - name: Build + create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Spifora v__VERSION__"
          releaseBody: "Internal build artifact — not linked from spifora.com. See Spifora-site/downloads/ for the public installers."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── 2. Publish installers to the public site (runs once, after both) ─────
  publish-site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Erp (for version)
        uses: actions/checkout@v4
        with:
          path: erp

      # Requires a repo secret SPIFORA_SITE_PAT: a GitHub Personal Access Token
      # (classic "repo" scope, or fine-grained scoped to Ajalsr/Spifora-site
      # with Contents: read/write). The default GITHUB_TOKEN only has access
      # inside THIS repo — pushing to another repo needs its own credential.
      - name: Checkout Spifora-site
        uses: actions/checkout@v4
        with:
          repository: Ajalsr/Spifora-site
          token: ${{ secrets.SPIFORA_SITE_PAT }}
          path: spifora-site

      # Source of truth is tauri.conf.json's own version, not the pushed git
      # tag (they may not match) — so we download exactly what was built.
      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./erp/src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p assets
          gh release download "app-v${VERSION}" --repo Ajalsr/Erp --dir assets \
            --pattern "*.exe" --pattern "*.msi" --pattern "*.dmg"
          ls -la assets

      - name: Copy installers into Spifora-site/downloads (fixed filenames)
        shell: bash
        run: |
          set -e
          mkdir -p spifora-site/downloads
          cp assets/*x64-setup.exe   spifora-site/downloads/Spifora_1.0.0_x64-setup.exe
          cp assets/*_x64_en-US.msi  spifora-site/downloads/Spifora_1.0.0_x64_en-US.msi
          cp assets/*.dmg            spifora-site/downloads/Spifora_1.0.0_universal.dmg

      - name: Update version badge on spifora.html
        shell: bash
        run: |
          set -e
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          sed -i -E "s/Version [0-9]+\.[0-9]+\.[0-9]+ — released [0-9]{4}-[0-9]{2}-[0-9]{2}/Version ${VERSION} — released ${RELEASE_DATE}/" \
            spifora-site/spifora.html

      - name: Commit and push to Spifora-site
        working-directory: spifora-site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/Spifora_1.0.0_x64-setup.exe downloads/Spifora_1.0.0_x64_en-US.msi downloads/Spifora_1.0.0_universal.dmg spifora.html
          git diff --cached --quiet || git commit -m "chore: refresh desktop installers + version badge (Erp ${{ github.ref_name }})"
          git push
